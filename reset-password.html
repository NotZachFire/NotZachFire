<!DOCTYPE html>
<html>
<head>
<title>Reset Your Password</title>
<style>
* { box-sizing: border-box; }
body { font-family: monospace; background: #111; color: #f00; padding: 20px; margin: 0; }
#reset-screen {
    text-align: center;
    margin: 80px auto;
    border: 2px solid #0f0;
    background: rgba(0,0,0,0.92);
    padding: 40px;
    max-width: 480px;
    box-shadow: 0 0 30px rgba(0,255,0,0.3);
}
h1 { color: #fff; font-size: 26px; text-shadow: 0 0 10px #fff; }
p { color: #0f0; font-size: 13px; letter-spacing: 2px; }
input[type="password"] {
    background: #000; color: #0f0; border: 1px solid #0f0;
    padding: 12px 15px; font-size: 15px; width: 100%; margin: 10px 0;
    font-family: monospace;
}
input:focus { outline: none; border-color: #fff; }
button {
    background: #0f0; color: #000; border: none; padding: 13px;
    font-weight: bold; font-size: 15px; width: 100%; cursor: pointer;
    font-family: monospace; margin-top: 10px;
}
button:hover { background: #fff; }
#msg { margin-top: 15px; font-size: 14px; }
.error { color: #f55; }
.success { color: #0f0; }
</style>
</head>
<body>

<div id="reset-screen">
    <h1>NEW CREDENTIALS</h1>
    <p>UPDATE SYSTEM ACCESS PASSWORD</p>
    
    <input type="password" id="new-password" placeholder="ENTER NEW PASSWORD...">
    <input type="password" id="confirm-password" placeholder="CONFIRM NEW PASSWORD...">
    <button onclick="updatePassword()">UPDATE PASSWORD</button>
    
    <div id="msg"></div>
</div>

<!-- SUPABASE SDK -->
<script src="https://jsdelivr.net"></script>

<script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Z8Rk_w-UUMjfuXrbmjMDAg_I4GCiXp4';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function updatePassword() {
        const pass = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        const msg = document.getElementById('msg');

        if (!pass || !confirm) {
            msg.textContent = 'ALL FIELDS REQUIRED';
            msg.className = 'error';
            return;
        }
        if (pass !== confirm) {
            msg.textContent = 'PASSWORDS DO NOT MATCH';
            msg.className = 'error';
            return;
        }
        if (pass.length < 6) {
            msg.textContent = 'MUST BE 6+ CHARACTERS';
            msg.className = 'error';
            return;
        }

        msg.textContent = 'UPDATING SYSTEM...';
        msg.className = '';

        // Supabase uses the active token in the URL automatically to update the user
        const { error } = await sb.auth.updateUser({ password: pass });

        if (error) {
            msg.textContent = 'ERROR: ' + error.message.toUpperCase();
            msg.className = 'error';
        } else {
            msg.textContent = 'PASSWORD UPDATED! REDIRECTING TO LOGIN...';
            msg.className = 'success';
            setTimeout(() => {
                window.location.href = 'https://zachfire.co.uk'; // Send back to login page
            }, 3000);
        }
    }
</script>
</body>
</html>
